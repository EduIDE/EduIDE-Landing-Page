name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: '0 2 * * *'

  release:
    types:
      - published
      - prereleased

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (e.g. my-test-tag, or 2.3.0 for the release train)"
        required: false
        default: ""
        type: string
      disable_layer_cache:
        description: "Disable the Docker layer cache (--no-cache) for stress testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-landing-page:
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: Dockerfile
      image-name: eduide/eduide-landing-page
      docker-context: .
      # Deliberately NOT passed on a release. An override is used verbatim by
      # the shared workflow, which would defeat its `${RELEASE_TAG#v}`
      # normalisation and publish `v1.2.0` instead of `1.2.0` - a tag no chart
      # can consume, since appVersion and the image tag must be one string.
      image-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_layer_cache) || false }}
      # Small nginx + Vite build; the disk-reclaim step is not worth the time.
      free-disk-space: false
    secrets: inherit
