# The lint script uses --max-warnings 0, so a single new warning fails the job
# on purpose. The type-check runs here too, so a PR sees type errors without
# waiting for the Docker build.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  # Renovate reports vulnerabilities already on main; this one blocks a PR that
  # is about to add a new dependency with a known advisory.
  # It compares a PR's base and head, so a push to main has nothing to review.
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: EduIDE/.github/.github/workflows/dependency-review.yml@v1
