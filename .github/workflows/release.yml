# Manual release. The only way the landing page releases.
#
#   gh workflow run release.yml -R EduIDE/EduIDE-Landing-Page --ref main -f version=1.4.0
#   gh workflow run release.yml -R EduIDE/EduIDE-Landing-Page --ref my-branch -f version=1.4.0-rc.1
#
# Pushes ghcr.io/eduide/eduide-landing-page:<version> (no leading v) and creates
# the GitHub Release. A release candidate (-rc.N) makes a prerelease.
#
# A release created with GITHUB_TOKEN triggers no other workflow, so the image
# build is called from here instead of being triggered by the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.4.0, or 1.4.0-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Built before the tag exists: a failed build costs a re-run, not a tag
  # without an image.
  image:
    name: Image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ inputs.version }}
    secrets: inherit

  release:
    name: Tag and GitHub Release
    needs: image
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"
      version_check: |
        case "$VERSION" in *-rc.*) exit 0 ;; esac
        got=$(jq -r .version package.json)
        [ "$got" = "$VERSION" ] || { echo "package.json says $got, expected $VERSION. Bump it in the release pull request."; exit 1; }

  verify:
    name: Verify
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check the image
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/eduide/eduide-landing-page:${VERSION}"
          echo "## Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
