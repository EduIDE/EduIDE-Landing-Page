# Query strings carry secrets (artemisToken, gitUri), so only the path is logged.
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log no_query;
    # A missing file's error message would contain the query string as well.
    log_not_found off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # nginx does not merge add_header across levels: any location that sets its
    # own add_header loses the ones inherited from here. The headers are therefore
    # repeated (via the snippet below) in every location that adds a header of its
    # own, so they are present on every response.
    #
    # The CSP allows the app itself ('self'), the local service and Keycloak endpoints
    # from public/config.js, and - via the scheme-wide https: sources
    # on connect-src/form-action/frame-src - the deployment-specific service API,
    # Keycloak and Sentry hosts (which are injected at runtime through config.js
    # and so cannot be enumerated statically here).
    set $eduide_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https: http://localhost:*; frame-src 'self' https: http://localhost:*; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https:";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $eduide_csp always;

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $eduide_csp always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $eduide_csp always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $eduide_csp always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/javascript
               application/xml+rss application/json application/xml;
}
